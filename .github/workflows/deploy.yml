name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: acr-ac-rag
  REGION: us-east1
  BUCKET_NAME: acr-ac-rag-data-667793722294

permissions:
  contents: read

jobs:
  test:
    name: Run Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Compile Checks
        run: |
          python -m py_compile main.py fhir_converter.py rag_engine.py safety_engine.py protocol_mapper.py llm_router.py

      - name: Run Pytest
        run: |
          pip install pytest
          pytest test_safety_security.py

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --update-env-vars CHROMA_PATH="/tmp/chroma_db_gemini",PROCEDURES_DB_PATH="/tmp/acr_procedures.db",CACHE_DB_PATH="/tmp/query_cache.db",CHROMA_SOURCE_PATH="/mnt/gcs/chroma_db_gemini",PROCEDURES_SOURCE_PATH="/mnt/gcs/data/acr_procedures.db",CACHE_SOURCE_PATH="/mnt/gcs/data/query_cache.db",BM25_RETRIEVER_SOURCE_PATH="/mnt/gcs/data/bm25_retriever.pkl",BM25_CHUNKS_SOURCE_PATH="/mnt/gcs/data/bm25_chunks.pkl",EMBEDDING_MODE="gemini",ENABLE_NLP_EXPANSION="false",ENABLE_LLM_RERANK="true",ENABLE_LLM_FUZZY_MATCH="false",MAX_CANDIDATES="3",BYPASS_FHIR_LLM="false" \
            --memory 2Gi \
            --add-volume name=acr-data,type=cloud-storage,bucket=${{ env.BUCKET_NAME }} \
            --add-volume-mount volume=acr-data,mount-path=/mnt/gcs \
            --allow-unauthenticated

