name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: acr-ac-rag
  REGION: us-east1
  BUCKET_NAME: acr-ac-rag-data-667793722294

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --update-env-vars CHROMA_PATH="/tmp/chroma_db_gemini",PROCEDURES_DB_PATH="/tmp/acr_procedures.db",CACHE_DB_PATH="/tmp/query_cache.db",CHROMA_SOURCE_PATH="/mnt/gcs/chroma_db_gemini",PROCEDURES_SOURCE_PATH="/mnt/gcs/data/acr_procedures.db",EMBEDDING_MODE="gemini" \
            --memory 2Gi \
            --add-volume name=acr-data,type=cloud-storage,bucket=${{ env.BUCKET_NAME }} \
            --add-volume-mount volume=acr-data,mount-path=/mnt/gcs \
            --allow-unauthenticated
